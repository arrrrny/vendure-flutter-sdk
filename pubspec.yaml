name: vendure
description: Flutter SDK for Vendure Open Source Headless Commerce Framework.
version: 3.1.0
homepage: https://github.com/arrrrny/vendure-flutter-sdk

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  json_annotation: ^4.12.0
  graphql: ^5.2.4
  http: ^1.6.0
  zorphy_annotation:
    git:
      url: https://github.com/arrrrny/zorphy.git
      path: zorphy_annotation
      ref: development

dev_dependencies:
  build_runner: ^2.4.11
  json_serializable: ^6.13.2
  test: ^1.26.3
  lints: ^6.1.0
  zorphy:
    git:
      url: https://github.com/arrrrny/zorphy.git
      path: zorphy
      ref: development

dependency_overrides:
  zorphy:
    path: ../zorphy/zorphy
  zorphy_annotation:
    path: ../zorphy/zorphy_annotation
