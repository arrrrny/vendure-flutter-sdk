name: vendure
description: Flutter SDK for Vendure Open Source Headless Commerce Framework.
version: 3.0.2
homepage: https://github.com/arrrrny/vendure-flutter-sdk
# Retired publish flow (issue #22): the `vendure` pub.dev name now belongs to
# arrrrny/zuraffa_vendure (7.4.x). Publishing 3.0.2 from here would be a
# regressive release into the successor's live line, so publishing is stopped
# at the package level. See PUBLISH.md.
publish_to: 'none'

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  json_annotation: ^4.12.0
  graphql_plus: ^5.2.6
  http: ^1.6.0

dev_dependencies:
  build_runner: ^2.4.11
  json_serializable: ^6.13.2
  test: ^1.26.3
  lints: ^6.1.0
