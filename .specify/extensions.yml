installed:
- bug
- chore
- gh-triage
- git
- gym
- spec-stats
- tdd
settings:
  auto_execute_hooks: true
hooks:
  before_implement:
  - extension: gym
    command: speckit.gym.gate
    enabled: true
    optional: true
    priority: 10
    prompt: Require an open GYM gate before implementing?
    description: Block implementation until the operator has cleared the GYM gate
    condition: null
  - extension: tdd
    command: speckit.tdd.run
    enabled: true
    optional: false
    priority: 10
    prompt: Drive the behavioral tasks through the red-green-refactor loop first?
    description: Run the loop over every behavior on the feature's tdd/test-list.md,
      one failing test at a time with the red recorded, ticking the tasks each behavior
      completes so /speckit.implement then covers only the work that is not a behavior
      change
    condition: null
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    priority: 10
    prompt: Commit outstanding changes before implementation?
    description: Auto-commit before implementation
    condition: null
  after_tasks:
  - extension: tdd
    command: speckit.tdd.plan
    enabled: true
    optional: true
    priority: 10
    prompt: Derive the TDD test list and make the test tasks in tasks.md mandatory?
    description: Generate specs/<feature>/tdd/test-list.md from spec.md and plan.md,
      then reorder tasks.md so every behavior has a failing test before its implementation
    condition: null
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    priority: 10
    prompt: Commit task changes?
    description: Auto-commit after task generation
    condition: null
  after_implement:
  - extension: tdd
    command: speckit.tdd.verify
    enabled: true
    optional: true
    priority: 10
    prompt: Audit TDD discipline and test strength for this feature?
    description: 'Write specs/<feature>/tdd/verification.md: test-first evidence,
      test-smell rubric, mutation results, and acceptance-criteria coverage'
    condition: null
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    priority: 10
    prompt: Commit implementation changes?
    description: Auto-commit after implementation
    condition: null
  before_constitution:
  - extension: git
    command: speckit.git.initialize
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.git.initialize?
    description: Initialize Git repository before constitution setup
    condition: null
  before_specify:
  - extension: git
    command: speckit.git.feature
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.git.feature?
    description: Create feature branch before specification
    condition: null
  before_clarify:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    priority: 10
    prompt: Commit outstanding changes before clarification?
    description: Auto-commit before spec clarification
    condition: null
  before_plan:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    priority: 10
    prompt: Commit outstanding changes before planning?
    description: Auto-commit before implementation planning
    condition: null
  before_tasks:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    priority: 10
    prompt: Commit outstanding changes before task generation?
    description: Auto-commit before task generation
    condition: null
  before_checklist:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    priority: 10
    prompt: Commit outstanding changes before checklist?
    description: Auto-commit before checklist generation
    condition: null
  before_analyze:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    priority: 10
    prompt: Commit outstanding changes before analysis?
    description: Auto-commit before analysis
    condition: null
  before_taskstoissues:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    priority: 10
    prompt: Commit outstanding changes before issue sync?
    description: Auto-commit before tasks-to-issues conversion
    condition: null
  after_constitution:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    priority: 10
    prompt: Commit constitution changes?
    description: Auto-commit after constitution update
    condition: null
  after_specify:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    priority: 10
    prompt: Commit specification changes?
    description: Auto-commit after specification
    condition: null
  after_clarify:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    priority: 10
    prompt: Commit clarification changes?
    description: Auto-commit after spec clarification
    condition: null
  after_plan:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    priority: 10
    prompt: Commit plan changes?
    description: Auto-commit after implementation planning
    condition: null
  after_checklist:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    priority: 10
    prompt: Commit checklist changes?
    description: Auto-commit after checklist generation
    condition: null
  after_analyze:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    priority: 10
    prompt: Commit analysis results?
    description: Auto-commit after analysis
    condition: null
  after_taskstoissues:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    priority: 10
    prompt: Commit after syncing issues?
    description: Auto-commit after tasks-to-issues conversion
    condition: null
